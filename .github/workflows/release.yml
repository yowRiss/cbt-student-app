name: Build & Release CBT Mobile APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi (misal: v1.0.1)'
        required: true
        default: 'v1.0.1'
      notes:
        description: 'Catatan rilis'
        required: false
        default: 'Pembaruan aplikasi CBT Siswa'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Split & Universal APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Ensure Gradle Wrapper Distribution (Fast Mirror via gh)
        run: |
          mkdir -p /tmp/gradle-dist
          gh release download v9.3.1 --repo gradle/gradle-distributions --pattern "gradle-9.3.1-bin.zip" --dir /tmp/gradle-dist
          python3 -m http.server 8089 --directory /tmp/gradle-dist &
          sleep 1
          sed -i 's|distributionUrl=.*|distributionUrl=http\\://127.0.0.1:8089/gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Optimized Universal APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          echo "🔨 Building Optimized Universal APK with Obfuscation..."
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols --android-skip-build-dependency-validation

      - name: 🏷️ Determine Release Tag & Prepare Assets
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk cbt-student-app-universal.apk

          ls -lh cbt-student-app-universal.apk

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: SDNTD3 Ujian ${{ steps.prep.outputs.tag }}
          body: |
            ## Pembaruan Aplikasi SDNTD3 Ujian (${{ steps.prep.outputs.tag }})
            
            ${{ github.event.inputs.notes || 'Pembaruan aplikasi CBT dengan ukuran file Universal yang telah dioptimasi dan diringankan.' }}
            
            ### File Unduhan:
            - **`cbt-student-app-universal.apk`**: Paket Universal resmi yang telah dioptimasi untuk semua HP Android siswa (32-bit & 64-bit).

            ### Petunjuk Pemasangan:
            1. Unduh `cbt-student-app-universal.apk`.
            2. **PENTING (Jika Update Muncul "App Not Installed"):** Silakan uninstall aplikasi CBT versi lama terlebih dahulu dari HP sebelum memasang APK baru.
            3. Izinkan pemasangan aplikasi dari sumber tidak dikenal jika diminta.
            4. Buka aplikasi dan mulai ujian.
          files: |
            cbt-student-app-universal.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
