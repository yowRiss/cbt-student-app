name: Build & Release CBT Mobile APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi (misal: v1.0.1)'
        required: true
        default: 'v1.0.1'
      notes:
        description: 'Catatan rilis'
        required: false
        default: 'Pembaruan aplikasi CBT Siswa'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Split & Universal APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Ensure Gradle Wrapper Distribution (Fast Mirror via gh)
        run: |
          mkdir -p /tmp/gradle-dist
          gh release download v9.3.1 --repo gradle/gradle-distributions --pattern "gradle-9.3.1-bin.zip" --dir /tmp/gradle-dist
          python3 -m http.server 8089 --directory /tmp/gradle-dist &
          sleep 1
          sed -i 's|distributionUrl=.*|distributionUrl=http\\://127.0.0.1:8089/gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Universal APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          echo "🔨 Building Universal APK (Semua Arsitektur arm64, armeabi-v7a, x86_64)..."
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk cbt-student-app-universal.apk
          cp cbt-student-app-universal.apk cbt-student-app.apk

          ls -lh cbt-student-app-*.apk

      - name: 🏷️ Determine Release Tag & Prepare Assets
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: SDNTD3 Ujian ${{ steps.prep.outputs.tag }}
          body: |
            ## Pembaruan Aplikasi SDNTD3 Ujian (${{ steps.prep.outputs.tag }})
            
            ${{ github.event.inputs.notes || 'Pembaruan aplikasi CBT resmi untuk semua tipe HP & Tablet siswa.' }}
            
            ### File Unduhan Resmi:
            - **`cbt-student-app-universal.apk`**: Paket Universal resmi yang berjalan di SEMUA perangkat Android siswa (Android 7.0+).
            - **`cbt-student-app.apk`**: Tautan alternatif file universal untuk kemudahan pemasangan.
            
            ### Kompatibilitas Sistem Operasi:
            - Mendukung Android 7.0 (Nougat, API 24) sampai dengan Android 14 / 15.
            - Kompatibel dengan semua jenis prosesor HP: ARM64 (Poco, Xiaomi HyperOS, Samsung, Oppo, Vivo, Realme), ARM32 (Infinix, Android Go), dan x86_64.

            ### Petunjuk Pemasangan:
            1. Unduh APK di atas.
            2. Buka file installer dan izinkan pemasangan aplikasi jika diminta sistem Android.
            3. Aplikasi dapat langsung menimpa versi sebelumnya tanpa perlu uninstall.
          files: |
            cbt-student-app-universal.apk
            cbt-student-app.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
