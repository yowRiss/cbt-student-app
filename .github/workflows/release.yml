name: Build & Release CBT Universal APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi (misal: v1.0.1)'
        required: true
        default: 'v1.0.1'
      notes:
        description: 'Catatan rilis'
        required: false
        default: 'Pembaruan aplikasi CBT Siswa'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Universal APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          flutter build apk --release

      - name: 🏷️ Determine Release Tag & Prepare Assets
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # Rename APK for clean download
          BUILD_APK="build/app/outputs/flutter-apk/app-release.apk"
          cp "$BUILD_APK" "cbt-student-app-$TAG_NAME.apk"
          cp "$BUILD_APK" "cbt-student-app-universal.apk"

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: CBT Student App ${{ steps.prep.outputs.tag }}
          body: |
            ## Pembaruan Aplikasi CBT Siswa (${{ steps.prep.outputs.tag }})
            
            ${{ github.event.inputs.notes || 'Pembaruan aplikasi CBT dengan perbaikan performa dan kestabilan ujian.' }}
            
            ### Cara Pasang di HP Android:
            1. Unduh file **`cbt-student-app-universal.apk`** di bawah.
            2. Buka file hasil unduhan di HP/tablet Android siswa.
            3. Jika muncul peringatan izin, pilih *Izinkan dari sumber ini* lalu klik *Install*.
            4. Buka aplikasi CBT dan mulai ujian.
          files: |
            cbt-student-app-universal.apk
            cbt-student-app-${{ steps.prep.outputs.tag }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
