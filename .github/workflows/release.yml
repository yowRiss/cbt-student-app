name: Build & Release CBT Mobile APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi (misal: v1.0.1)'
        required: true
        default: 'v1.0.1'
      notes:
        description: 'Catatan rilis'
        required: false
        default: 'Pembaruan aplikasi CBT Siswa'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Split & Universal APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Ensure Gradle Wrapper Distribution (Fast Mirror via gh)
        run: |
          mkdir -p /tmp/gradle-dist
          gh release download v9.3.1 --repo gradle/gradle-distributions --pattern "gradle-9.3.1-bin.zip" --dir /tmp/gradle-dist
          python3 -m http.server 8089 --directory /tmp/gradle-dist &
          sleep 1
          sed -i 's|distributionUrl=.*|distributionUrl=http\\://127.0.0.1:8089/gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Split Per ABI & Universal APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          echo "🔨 Building Split per ABI APKs (ARM64 & ARM32)..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk cbt-student-app-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk cbt-student-app-armeabi-v7a.apk

          echo "🔨 Building Universal APK (Semua Arsitektur)..."
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk cbt-student-app-universal.apk

          ls -lh cbt-student-app-*.apk

      - name: 🏷️ Determine Release Tag & Prepare Assets
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: SDNTD3 Ujian ${{ steps.prep.outputs.tag }}
          body: |
            ## Pembaruan Aplikasi SDNTD3 Ujian (${{ steps.prep.outputs.tag }})
            
            ${{ github.event.inputs.notes || 'Pembaruan aplikasi CBT resmi untuk semua tipe HP & Tablet siswa.' }}
            
            ### Pilihan File Unduhan:
            - **`cbt-student-app-universal.apk`**: Paket Universal resmi yang berjalan di SEMUA perangkat Android siswa tanpa kecuali.
            - **`cbt-student-app-arm64-v8a.apk`**: Khusus HP Android modern 64-bit (Poco C75, Xiaomi HyperOS, Samsung, Oppo, Vivo, Realme, Redmi Pad).
            - **`cbt-student-app-armeabi-v7a.apk`**: Khusus HP Android 32-bit (Infinix SMART 6 PLUS, Android Go, HP lama).

            ### Petunjuk Pemasangan:
            1. Unduh APK sesuai tipe HP Anda (Universal selalu disarankan jika ragu).
            2. **PENTING (Jika Muncul "Aplikasi Tidak Terpasang" / "Paket Tidak Valid"):** Silakan uninstall aplikasi CBT versi lama terlebih dahulu dari HP sebelum memasang APK baru.
            3. Izinkan pemasangan aplikasi dari sumber tidak dikenal jika diminta.
            4. Buka aplikasi dan mulai ujian.
          files: |
            cbt-student-app-universal.apk
            cbt-student-app-arm64-v8a.apk
            cbt-student-app-armeabi-v7a.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
