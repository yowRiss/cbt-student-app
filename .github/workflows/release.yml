name: Build & Release CBT Mobile APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nomor versi (misal: v1.0.1)'
        required: true
        default: 'v1.0.1'
      notes:
        description: 'Catatan rilis'
        required: false
        default: 'Pembaruan aplikasi CBT Siswa'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Split & Universal APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🛠️ Build Split Per ABI & Universal APKs
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          echo "🔨 Building Split per ABI APKs..."
          flutter build apk --release --split-per-abi

          echo "🔨 Building Universal APK..."
          flutter build apk --release

      - name: 🏷️ Determine Release Tag & Prepare Assets
        id: prep
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

          # Rename split APKs for clean direct downloads
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk cbt-student-app-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk cbt-student-app-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk cbt-student-app-x86_64.apk

          # Universal APK
          cp build/app/outputs/flutter-apk/app-release.apk cbt-student-app-universal.apk

          ls -lh cbt-student-app-*.apk

      - name: 🚀 Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: CBT Student App ${{ steps.prep.outputs.tag }}
          body: |
            ## Pembaruan Aplikasi CBT Siswa (${{ steps.prep.outputs.tag }})
            
            ${{ github.event.inputs.notes || 'Pembaruan aplikasi CBT dengan optimasi ukuran file per arsitektur HP (Split per ABI).' }}
            
            ### Pilihan File APK Sesuai Tipe HP:
            - **`cbt-student-app-arm64-v8a.apk`** (Sangat Disarankan, ~9 MB): Untuk HP Android modern (keluaran 2017 ke atas: Samsung, Xiaomi, Oppo, Vivo, Realme, Infinix, dll).
            - **`cbt-student-app-armeabi-v7a.apk`** (~8 MB): Untuk HP Android lama (32-bit).
            - **`cbt-student-app-universal.apk`** (~25 MB): Paket lengkap berjalan di semua tipe HP Android tanpa kecuali.
            - **`cbt-student-app-x86_64.apk`** (~9 MB): Khusus Emulator PC (BlueStacks, LDPlayer, Waydroid) atau Chromebook Intel.

            ### Petunjuk Pemasangan:
            1. Unduh APK sesuai tipe HP Anda (atau gunakan fitur deteksi otomatis di website).
            2. **PENTING (Jika Update Muncul "App Not Installed"):** Silakan uninstall aplikasi CBT versi lama terlebih dahulu dari HP sebelum memasang APK baru.
            3. Izinkan pemasangan aplikasi dari sumber tidak dikenal jika diminta.
            4. Buka aplikasi CBT dan mulai ujian.
          files: |
            cbt-student-app-arm64-v8a.apk
            cbt-student-app-armeabi-v7a.apk
            cbt-student-app-x86_64.apk
            cbt-student-app-universal.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
